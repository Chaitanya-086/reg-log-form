<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navbar */
        .navbar {
            background-color: #333;
            display: flex;
            align-items: center;
            padding: 10px 30px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            margin-right: 40px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #310fac;
            border-radius: 5px;
        }

        .right {
            margin-left: auto;
        }

        .login,
        .register {
            background-color: green;
            border-radius: 5px;
        }

        .register {
            margin-left: 10px;
        }

        .login:hover,
        .register:hover {
            background-color: darkgreen !important;
        }

        /* Form Container */
        .container {
            width: 70%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: green;
            outline: none;
        }

        .submit-button {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 13px 35px;
            font-size: 17px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        .reset-button {
            background-color: #555;
            margin-left: 10px;
        }

        .reset-button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add Employee</h1>
        <form action="/addemployee" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Employee Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Employee Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter email" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="Enter phone number" required>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="">--select department--</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="FINANCE">FINANCE</option>
                        <option value="MARKETING">MARKETING</option>
                        <option value="SALES">SALES</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" name="salary" placeholder="Enter salary" required>
                </div>
                <div class="form-group">
                    <label for="joining_date">Joining date</label>
                    <input type="date" id="joining_date" name="joining_date" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter employee address" required></textarea>
                </div>
                <br><br>
                    <div class="buttons">
                        <button type="submit" class="add-btn">
                            Add Employee
                        </button>
                        <button type="reset" class="reset-btn">
                            Reset
                        </button>
                    </div>
                </div>
        </form>
    </div>
</body>

</html>
