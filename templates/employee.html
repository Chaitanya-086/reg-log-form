<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Details</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
        }

        .container {
            width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #151616;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #3512b6;
            color: white;
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background-color: #f0f8f4;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Employee Details</h1>

        <table>

            <tr>
                <th>Employee Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Joining Date</th>
                <th>Address</th>
            </tr>

        </table>

    </div>

</body>

</html>
