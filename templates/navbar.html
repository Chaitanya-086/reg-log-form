<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Application</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #333;
            display: flex;
            align-items: center;
            padding: 10px 30px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            margin-right: 40px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #310fac;
            border-radius: 5px;
        }

        /* Login and Register on right */
        .right {
            margin-left: auto;
        }

        /* Green Login Button */
        .login {
            background-color: green;
            border-radius: 5px;
        }

        /* Green Register Button */
        .register {
            background-color: green;
            border-radius: 5px;
            margin-left: 10px;
        }

        /* Hover effect */
        .login:hover,
        .register:hover {
            background-color: darkgreen !important;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">Employee Management System</div>

        <a href="/home">Home</a>
        <a href="/employee">Employee</a>
        <a href="/addemployee">Add Employee</a>
        <a href="/search">Search</a>

        <div class="right">
            <a href="/login" class="login">Login</a>
            <a href="/register" class="register">Register</a>
        </div>

    </div>

</body>
</html>
